services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2transport-web
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
